services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: snaphere
      POSTGRES_USER: snaphere
      POSTGRES_PASSWORD: snaphere
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snaphere"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
