# SnapHere API 리버스 프록시
#
# 배치: ~/snaphere/nginx/conf.d/api.conf
#       (docker-compose.yml 이 ./nginx/conf.d 를 :ro 로 마운트한다)
# 반영: docker compose exec nginx nginx -s reload
#       문법 검사: docker compose exec nginx nginx -t

# 도커 내장 DNS. 업스트림을 변수로 두고 매번 여기서 해석한다.
#
# proxy_pass http://app:8080 처럼 이름을 직접 쓰면 nginx 가 기동 시점에 한 번만
# 해석하고, 그때 app 컨테이너가 없으면 "host not found in upstream" 으로
# nginx 자체가 뜨지 않는다. 배포 중 app 재생성 90초 동안 80 포트까지 닫히는
# 상황을 막기 위해 변수 + resolver 를 쓴다. app 이 없으면 502 를 낸다.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 실제 파일 업로드는 S3 presigned URL 로 앱에서 직접 올라간다(SYS-020).
    # 여기를 지나는 건 JSON 뿐이라 크게 열어둘 이유가 없다.
    client_max_body_size 2m;

    # Let's Encrypt HTTP-01 챌린지. 인증서 발급·갱신에 필요하다.
    # HTTPS 로 리다이렉트하기 전에 이 블록이 먼저 와야 한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── actuator ──────────────────────────────────────────────────────────
    # application.yml 이 health,info,metrics 를 노출한다. 저장소가 public 이고
    # 서버도 공인 IP 라, health 만 열고 나머지는 여기서 끊는다.
    # (= 로 정확히 일치하는 경로만. /actuator/health/... 하위는 아래 deny 로 간다)
    location = /actuator/health {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app;
        include /etc/nginx/conf.d/proxy-headers.inc;

        # 배포 직후 app 이 아직 안 떴을 때 60초씩 매달리지 않게 짧게 둔다.
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # /actuator/metrics, /actuator/info, /actuator/env 등 전부 차단.
    # 404 로 준다 — 403 은 "여기 뭔가 있다"를 알려주는 셈이다.
    location /actuator {
        return 404;
    }

    # ── API ───────────────────────────────────────────────────────────────
    location /api/ {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # TourAPI 동기화 같은 관리 호출이 오래 걸릴 수 있다.
        proxy_read_timeout 60s;
    }

    # 공유 링크 OG 태그 (CMU-020). 카카오톡·슬랙 크롤러가 이 경로를 읽는다.
    location /p/ {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # 그 밖의 경로는 아무것도 알려주지 않는다.
    location / {
        return 404;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────
# 인증서를 발급받은 뒤에 아래 블록의 주석을 해제하고,
# 위 server 블록의 API·actuator·/p/ location 을 여기로 옮긴 다음
# 80 은 리다이렉트만 남긴다.
#
# ⚠ 인증서 파일이 없는 상태에서 이 블록을 켜면 nginx 가 기동에 실패한다.
#   (cannot load certificate ... No such file or directory)
#   반드시 certbot 발급을 먼저 끝낼 것 — README-deploy.md 6단계.
#
