# SnapHere API — 공통 설정
# 명세: docs/03-api-spec.md > 2. 공통 규약
spring:
  config:
    # 개발 시 저장소 루트의 .env를 Spring properties로 읽는다. 운영 환경 변수는 이를 덮어쓴다.
    import: optional:file:../.env[.properties]
  application:
    name: snaphere-api
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Seoul          # SYS-005
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/snaphere}
    username: ${DB_USERNAME:snaphere}
    password: ${DB_PASSWORD:snaphere}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  servlet:
    context-path: /                # Base URL 접두어는 컨트롤러의 /api/v1 로 표기 (SYS-013)

snaphere:
  # true 로 두면 places·regions 를 읽지 않고 고정 데이터로 등급 판정을 돌린다.
  # PostgreSQL 을 띄우지 않고 앱과 흐름만 맞춰 볼 때만 쓴다 (StubPlaceData).
  # V2~V4 마이그레이션이 들어왔으므로 기본값은 false — 실제 테이블을 읽는다.
  stub-data: ${SNAPHERE_STUB_DATA:false}
  api:
    base-path: /api/v1             # SYS-013
  jobs:
    # 주기 배치 실행 여부. 분산 락이 없어 여러 인스턴스를 띄울 때는 한 대만 true 로 둔다 —
    # 두 대가 동시에 돌면 같은 기간의 집계를 서로 지우고 넣는다 (JOB-013)
    enabled: ${SNAPHERE_JOBS_ENABLED:true}
  paging:
    default-size: 20               # SYS-003
    max-size: 50
  cors:
    allowed-origins: ""            # SYS-014 — 환경별 allowlist, 와일드카드 금지
  auth:
    google-client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    jwt-secret: ${SNAPHERE_JWT_SECRET:}
    terms-version: ${SNAPHERE_TERMS_VERSION:2026-08-01}
  share:
    web-base-url: ${SNAPHERE_SHARE_BASE_URL:https://snaphere.app}  # 앱 설치 시 같은 주소가 앱으로 열린다 (CMU-021)
    path-prefix: /p/
    default-title: SnapHere              # OG 태그는 완성 문장이어야 한다 — SYS-010 의 예외 (CMU-020)
    default-description: SnapHere에서 사진을 확인하세요
  media:
    # provider=stub 이면 실제 업로드 없이 형태만 같은 주소를 준다 (로컬 개발용)
    provider: ${MEDIA_PROVIDER:stub}
    bucket: ${MEDIA_S3_BUCKET:}
    region: ${MEDIA_S3_REGION:ap-northeast-2}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
    presign-ttl: 5m                # SYS-020 — 서명 주소 유효 시간
    max-file-size-bytes: 10485760  # PST-015 — 장당 10MB
    # AWS 자격증명은 여기 적지 않는다. SDK 기본 체인(환경변수·프로파일·인스턴스 역할)을 쓴다

logging:
  level:
    com.snaphere.api: DEBUG
