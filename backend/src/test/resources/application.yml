# 테스트 전용 설정
#
# 스키마는 Flyway 가 아니라 Hibernate 가 엔티티에서 만든다.
# V2__place_schema.sql 이 PostGIS(geography · GiST)와 pg_trgm, 생성 열을 쓰기 때문에
# H2 에서는 실행되지 않는다. 실제 DDL 검증은 PostgreSQL 을 띄운 환경에서
# spring.jpa.hibernate.ddl-auto=validate 로 한다 (운영 기본값).
spring:
  datasource:
    url: jdbc:h2:mem:snaphere;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

snaphere:
  # 테스트는 DB 스키마를 Hibernate 로 만드므로 JPA 구현체를 그대로 쓴다
  stub-data: false
  # 주기 배치를 끈다. 컨텍스트 로드 테스트 중에 집계 배치가 도는 것을 막는다 (JOB-013)
  jobs:
    enabled: false
  auth:
    google-client-id: test-client-id
    jwt-secret: test-only-secret-that-is-at-least-thirty-two-bytes
